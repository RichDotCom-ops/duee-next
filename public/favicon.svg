<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background gradient: dark navy → dark green tint -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0a1a0e"/>
    </linearGradient>
    <!-- Green dot glow -->
    <radialGradient id="dot" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </radialGradient>
    <!-- Subtle inner shadow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="64" height="64" rx="14" stroke="rgba(255,255,255,0.07)" stroke-width="1" fill="none"/>

  <!-- Letter "d" — geometric path-based, no font dependency -->
  <!-- Bowl: arc from top (27,20) to bottom (27,54), radius=17, going left = bowl of the "d" -->
  <path
    d="M 27 20 A 17 17 0 1 0 27 54"
    stroke="white"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />
  <!-- Stem: right-side ascender, connects to bowl top and bottom -->
  <line
    x1="37" y1="5"
    x2="37" y2="54"
    stroke="white"
    stroke-width="11"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Brand dot — the "." in duee. — bright green with glow -->
  <circle cx="55" cy="55" r="6" fill="url(#dot)"/>
  <!-- Dot highlight -->
  <circle cx="53.5" cy="53" r="2" fill="rgba(255,255,255,0.35)"/>
</svg>
